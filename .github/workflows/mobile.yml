name: Build mobile

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: "2.11.4"
  # 内嵌前端来源（App 跟随 dev 打包）
  BOOK_REF: dev

jobs:
  # Nuxt SPA 静态包，与 build.yml 的 frontend job 相同
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aiastia/book
          ref: ${{ env.BOOK_REF }}
          token: ${{ secrets.MOYU_SOURCE_TOKEN }}
          sparse-checkout: frontend
          path: book

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/frontend/package-lock.json

      - name: Build frontend
        working-directory: book/frontend
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.MOYU_URL }}
          NUXT_PUBLIC_APP_MODE: 'true'
        run: |
          npm ci
          npx nuxt generate

      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: book/frontend/.output/public/

  android:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: src-tauri/app-dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Detect NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | tail -1)" >> "$GITHUB_ENV"

      - name: Generate icons
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION icon src-tauri/icons/app-icon.png -o src-tauri/icons

      - name: Init Android project
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION android init

      # 三个补丁: ① 系统栏 insets 修 UI 顶进状态栏 ② SwipeRefreshLayout 下拉刷新
      # ③ 墨色底+图标闪屏(修启动白屏观感)。模板的 WebView 是 wry 运行时塞进 content 的
      - name: Patch generated Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # --- MainActivity.kt: insets + 下拉刷新 + 深色底 ---
          p = Path("src-tauri/gen/android/app/src/main/java/com/aiastia/moyu/MainActivity.kt")
          s = p.read_text()
          s = s.replace(
              "import android.os.Bundle\nimport androidx.activity.enableEdgeToEdge",
              "import android.os.Bundle\nimport android.graphics.Color\n"
              "import android.view.ViewGroup\nimport android.webkit.WebView\n"
              "import androidx.core.view.ViewCompat\nimport androidx.core.view.WindowInsetsCompat\n"
              "import androidx.swiperefreshlayout.widget.SwipeRefreshLayout",
          )
          s = s.replace(
              "    enableEdgeToEdge()\n    super.onCreate(savedInstanceState)",
              """    super.onCreate(savedInstanceState)
                val content = findViewById<android.view.ViewGroup>(android.R.id.content)
                ViewCompat.setOnApplyWindowInsetsListener(content) { v, insets ->
                  val bars = insets.getInsets(
                    WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.ime()
                  )
                  v.setPadding(bars.left, bars.top, bars.right, bars.bottom)
                  WindowInsetsCompat.CONSUMED
                }
                val webview = content.getChildAt(0) as? WebView ?: return
                val swipe = SwipeRefreshLayout(this)
                val lp = webview.layoutParams
                content.removeView(webview)
                swipe.addView(
                    webview,
                    ViewGroup.LayoutParams(
                        if (lp.width > 0) lp.width else ViewGroup.LayoutParams.MATCH_PARENT,
                        if (lp.height > 0) lp.height else ViewGroup.LayoutParams.MATCH_PARENT,
                    ),
                )
                content.addView(
                    swipe,
                    ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT),
                )
                webview.setBackgroundColor(Color.parseColor("#171A24"))
                swipe.setOnRefreshListener {
                  webview.reload()
                  swipe.isRefreshing = false
                }
                // 启动遮罩: 动态加载动画盖住 WebView, 页面进度 100% 后淡出(20s 兜底强制淡出)
                val density = resources.displayMetrics.density
                val overlay = android.widget.FrameLayout(this)
                overlay.setBackgroundColor(Color.parseColor("#171A24"))
                overlay.isClickable = true
                val icon = android.widget.ImageView(this)
                icon.setImageResource(getApplicationInfo().icon)
                val ip = android.widget.FrameLayout.LayoutParams(
                    (170 * density).toInt(), (170 * density).toInt(), android.view.Gravity.CENTER
                )
                ip.topMargin = (-60 * density).toInt()
                overlay.addView(icon, ip)
                val bar = android.widget.ProgressBar(this)
                bar.indeterminateTintList = android.content.res.ColorStateList.valueOf(Color.parseColor("#F0EBD8"))
                val bp = android.widget.FrameLayout.LayoutParams(
                    android.view.ViewGroup.LayoutParams.WRAP_CONTENT,
                    android.view.ViewGroup.LayoutParams.WRAP_CONTENT,
                    android.view.Gravity.CENTER,
                )
                bp.topMargin = (110 * density).toInt()
                overlay.addView(bar, bp)
                content.addView(
                    overlay,
                    ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT),
                )
                val hide = object : Runnable {
                  override fun run() {
                    if (webview.progress >= 100) {
                      overlay.animate().alpha(0f).setDuration(350L).withEndAction {
                        (overlay.parent as? ViewGroup)?.removeView(overlay)
                      }.start()
                    } else {
                      webview.postDelayed(this, 150L)
                    }
                  }
                }
                webview.postDelayed(hide, 400L)
                webview.postDelayed(
                    {
                      if (overlay.parent != null) {
                        overlay.animate().alpha(0f).setDuration(350L).withEndAction {
                          (overlay.parent as? ViewGroup)?.removeView(overlay)
                        }.start()
                      }
                    },
                    20000L,
                )""",
          )
          p.write_text(s)
          assert "SwipeRefreshLayout" in s and "enableEdgeToEdge" not in s, "MainActivity patch failed"

          # --- 主题: 窗口背景换成 墨色+图标 闪屏 ---
          t = Path("src-tauri/gen/android/app/src/main/res/values/themes.xml")
          s = t.read_text()
          s = s.replace(
              "<!-- Customize your theme here. -->",
              '<item name="android:windowBackground">@drawable/splash</item>',
          )
          t.write_text(s)
          assert "splash" in s, "themes patch failed"

          d = Path("src-tauri/gen/android/app/src/main/res/drawable/splash.xml")
          d.parent.mkdir(exist_ok=True)
          d.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <item><shape><solid android:color="#171A24"/></shape></item>\n'
              '  <item android:drawable="@mipmap/ic_launcher" android:gravity="center"/>\n'
              "</layer-list>\n"
          )

          # --- 依赖: SwipeRefreshLayout ---
          g = Path("src-tauri/gen/android/app/build.gradle.kts")
          s = g.read_text()
          anchor = 'implementation("androidx.appcompat:appcompat:1.7.1")'
          s = s.replace(
              anchor,
              anchor + '\n    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")',
          )
          g.write_text(s)
          assert "swiperefreshlayout" in s, "gradle patch failed"

          # --- Manifest: 软键盘弹出时收缩窗口(配合上面的 ime insets) ---
          m = Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          s = s.replace(
              'android:name=".MainActivity"',
              'android:name=".MainActivity"\n            android:windowSoftInputMode="adjustResize"',
          )
          m.write_text(s)
          assert "adjustResize" in s, "manifest patch failed"
          PY

      # 在线更新: tauri-plugin-updater 仅支持桌面, 安卓没有官方方案, 沿用补丁风格
      # 原生自补一条等效链路: 启动查 GitHub latest release → 弹窗确认 →
      # DownloadManager 后台下载(系统通知栏带进度) → 完成广播 → 调起系统安装器覆盖安装
      - name: Patch Android in-app update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # --- Manifest: 只补安装 APK 权限(FileProvider 模板已自带, 同 authority 直接复用) ---
          m = Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          s = m.read_text(encoding="utf-8")
          s = s.replace(
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
          )
          m.write_text(s, encoding="utf-8")
          assert "REQUEST_INSTALL_PACKAGES" in s, "permission insert failed"
          assert s.count("FileProvider") == 1 and "fileprovider" in s, "template FileProvider missing/ambiguous"

          # --- FileProvider 路径表: 模板已有, 合并插入 Download 路径(别覆盖模板自己的条目) ---
          x = Path("src-tauri/gen/android/app/src/main/res/xml/file_paths.xml")
          if x.exists():
              s = x.read_text(encoding="utf-8")
          else:
              x.parent.mkdir(parents=True, exist_ok=True)
              s = '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n</paths>\n'
          if "external-files-path" not in s:
              s2 = re.sub(
                  r"(<paths[^>]*>)",
                  r'\1\n  <external-files-path name="apk" path="Download/" />',
                  s,
                  count=1,
              )
              assert s2 != s, "file_paths: <paths> tag not found"
              s = s2
          x.write_text(s, encoding="utf-8")
          assert "Download/" in s and "external-files-path" in s, "file_paths merge failed"

          # --- MainActivity: 启动检查 + 下载完成接收器 + 安装跳转 ---
          k = Path("src-tauri/gen/android/app/src/main/java/com/aiastia/moyu/MainActivity.kt")
          s = k.read_text(encoding="utf-8")
          assert "super.onCreate(savedInstanceState)" in s, "MainActivity anchor missing"
          s = s.replace(
              "super.onCreate(savedInstanceState)",
              "super.onCreate(savedInstanceState)\n"
              "        registerUpdateReceiver()\n"
              "        checkAppUpdate()",
              1,
          )
          s = s.rstrip()
          assert s.endswith("}"), "MainActivity unexpected tail"
          s = s[:-1] + '''
              // ===== 在线更新(GitHub Release): 桌面走 tauri-plugin-updater(仅支持桌面),
              // 安卓无官方方案, 原生自补: 启动查最新 release → 弹窗确认 → DownloadManager
              // 后台下载(通知栏带进度) → 完成广播 → FileProvider 调起系统安装器 =====
              private var pendingInstall: java.io.File? = null
              private var updateDownloadId: Long = -1L

              private val updateReceiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(ctx: android.content.Context, intent: android.content.Intent) {
                      try {
                          val id = intent.getLongExtra(android.app.DownloadManager.EXTRA_DOWNLOAD_ID, -1L)
                          if (id == -1L || id != updateDownloadId) return
                          val dm = getSystemService(android.app.DownloadManager::class.java)
                          val c = dm.query(android.app.DownloadManager.Query().setFilterById(id)) ?: return
                          val ok = c.moveToFirst() &&
                              c.getInt(c.getColumnIndexOrThrow(android.app.DownloadManager.COLUMN_STATUS)) ==
                                  android.app.DownloadManager.STATUS_SUCCESSFUL
                          var uri: String? = null
                          if (ok) uri = c.getString(c.getColumnIndexOrThrow(android.app.DownloadManager.COLUMN_LOCAL_URI))
                          c.close()
                          if (uri != null && uri.contains("moyu-")) {
                              updateDownloadId = -1L
                              installApk(java.io.File(java.net.URI(uri).path))
                          }
                      } catch (e: Exception) {
                          android.util.Log.w("MoyuUpdate", "download handoff failed: ${e.message}")
                      }
                  }
              }

              fun registerUpdateReceiver() {
                  androidx.core.content.ContextCompat.registerReceiver(
                      this,
                      updateReceiver,
                      android.content.IntentFilter(android.app.DownloadManager.ACTION_DOWNLOAD_COMPLETE),
                      androidx.core.content.ContextCompat.RECEIVER_NOT_EXPORTED,
                  )
              }

              fun checkAppUpdate() {
                  Thread {
                      try {
                          val cur = packageManager.getPackageInfo(packageName, 0).versionName ?: return@Thread
                          // 上一会话下载完但没装成的包(v >= 当前版本)直接补装, 旧残留清掉
                          if (checkPendingApk(cur)) return@Thread
                          val conn = java.net.URL("https://api.github.com/repos/aiastia-dockerhub/moyu-client/releases/latest")
                              .openConnection() as java.net.HttpURLConnection
                          conn.connectTimeout = 10000
                          conn.readTimeout = 10000
                          conn.setRequestProperty("Accept", "application/vnd.github+json")
                          conn.setRequestProperty("User-Agent", "moyu-android")
                          val body = conn.inputStream.bufferedReader().readText()
                          conn.disconnect()
                          val rel = org.json.JSONObject(body)
                          val tag = rel.optString("tag_name").removePrefix("v")
                          var apkUrl: String? = null
                          val assets = rel.optJSONArray("assets")
                          if (assets != null) {
                              for (i in 0 until assets.length()) {
                                  val a = assets.getJSONObject(i)
                                  if (a.optString("name").endsWith(".apk")) {
                                      apkUrl = a.optString("browser_download_url")
                                      break
                                  }
                              }
                          }
                          if (tag.isEmpty() || apkUrl == null || !isNewerVersion(tag, cur)) return@Thread
                          runOnUiThread {
                              android.app.AlertDialog.Builder(this)
                                  .setTitle("墨语 · 更新")
                                  .setMessage("发现新版本 v$tag，是否立即更新？下载完成后自动弹出安装。")
                                  .setPositiveButton("立即更新") { _, _ -> downloadUpdate(apkUrl!!, tag) }
                                  .setNegativeButton("下次再说", null)
                                  .show()
                          }
                      } catch (e: Exception) {
                          android.util.Log.w("MoyuUpdate", "check update failed: ${e.message}")
                      }
                  }.start()
              }

              private fun checkPendingApk(cur: String): Boolean {
                  try {
                      val dir = getExternalFilesDir(android.os.Environment.DIRECTORY_DOWNLOADS) ?: return false
                      val apks = dir.listFiles()?.filter { it.name.startsWith("moyu-") && it.name.endsWith(".apk") } ?: return false
                      for (apk in apks) {
                          val v = apk.name.removePrefix("moyu-").removeSuffix(".apk")
                          if (v == cur || isNewerVersion(v, cur)) {
                              runOnUiThread { installApk(apk) }
                              return true
                          }
                          apk.delete()
                      }
                  } catch (e: Exception) {
                      android.util.Log.w("MoyuUpdate", "pending apk check failed: ${e.message}")
                  }
                  return false
              }

              private fun isNewerVersion(remote: String, local: String): Boolean {
                  fun nums(v: String) = v.split('.', '-').mapNotNull { it.toIntOrNull() }
                  val r = nums(remote)
                  val l = nums(local)
                  for (i in 0 until maxOf(r.size, l.size)) {
                      val a = r.getOrElse(i) { 0 }
                      val b = l.getOrElse(i) { 0 }
                      if (a != b) return a > b
                  }
                  return false
              }

              private fun downloadUpdate(url: String, version: String) {
                  try {
                      val dm = getSystemService(android.app.DownloadManager::class.java)
                      if (updateDownloadId != -1L) dm.remove(updateDownloadId)
                      val req = android.app.DownloadManager.Request(android.net.Uri.parse(url))
                          .setTitle("墨语 v$version")
                          .setDescription("正在下载更新…")
                          .setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          .setDestinationInExternalFilesDir(this, android.os.Environment.DIRECTORY_DOWNLOADS, "moyu-$version.apk")
                      updateDownloadId = dm.enqueue(req)
                      android.widget.Toast.makeText(this, "已开始后台下载，完成后自动弹出安装", android.widget.Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      android.util.Log.w("MoyuUpdate", "download start failed: ${e.message}")
                  }
              }

              private fun installApk(file: java.io.File) {
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 26 && !packageManager.canRequestPackageInstalls()) {
                          pendingInstall = file
                          startActivity(
                              android.content.Intent(
                                  android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  android.net.Uri.parse("package:$packageName"),
                              )
                          )
                          return
                      }
                      pendingInstall = null
                      val uri = androidx.core.content.FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      startActivity(
                          android.content.Intent(android.content.Intent.ACTION_INSTALL_PACKAGE, uri)
                              .addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              .addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  } catch (e: Exception) {
                      android.util.Log.w("MoyuUpdate", "install failed: ${e.message}")
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val f = pendingInstall ?: return
                  if (android.os.Build.VERSION.SDK_INT < 26 || packageManager.canRequestPackageInstalls()) {
                      installApk(f)
                  }
              }
          ''' + "}\n"
          k.write_text(s, encoding="utf-8")
          assert "checkAppUpdate" in s and "installApk" in s, "MainActivity update patch failed"
          PY

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.MOYU_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MOYU_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/moyu.jks
          else
            # 无固定 keystore 时用临时签名（每次不同，覆盖安装需先卸载）
            keytool -genkeypair -v -keystore /tmp/moyu.jks -storepass moyu12345 -keypass moyu12345 \
              -alias moyu -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Moyu, O=aiastia, C=CN"
          fi
          echo "KS_PASS_FINAL=${KS_PASS:-moyu12345}" >> "$GITHUB_ENV"

      # v2 CLI 已无签名参数; android.injected.signing.* 写进 gradle.properties 与
      # Android Studio 的注入签名同机制
      - name: Inject signing config into gradle
        run: |
          printf '\n' >> src-tauri/gen/android/gradle.properties
          cat >> src-tauri/gen/android/gradle.properties <<EOF
          android.injected.signing.store.file=/tmp/moyu.jks
          android.injected.signing.store.password=$KS_PASS_FINAL
          android.injected.signing.key.alias=moyu
          android.injected.signing.key.password=$KS_PASS_FINAL
          EOF

      # gradle 的 rustBuild 任务从 src-tauri 调 npm run 找 CLI, 同样需要根 package.json
      - name: Prepare root npm project for gradle
        run: |
          printf '{"name":"moyu-client","private":true,"version":"0.0.0","scripts":{"tauri":"tauri"}}\n' > package.json
          npm install --no-save @tauri-apps/cli@$TAURI_CLI_VERSION

      - name: Build APK (arm64)
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION android build --target aarch64 --apk

      - uses: actions/upload-artifact@v4
        with:
          name: moyu-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk

  # 无 Apple 开发者账号也能出未签名 ipa: --ci 让 CLI 供给 xcode 脚本阶段的
  # options 服务, --no-sign 跳过签名。Xcode 26 会挂, 必须用 macos-15 (Xcode 16)
  ios:
    needs: frontend
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: src-tauri/app-dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION icon src-tauri/icons/app-icon.png -o src-tauri/icons

      - name: Init iOS project
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION ios init

      # Xcode 的 Build Rust Code 阶段经 npm run 从 gen/apple 向上找 package.json
      - name: Prepare root npm project for xcode script phase
        run: |
          printf '{"name":"moyu-client","private":true,"version":"0.0.0","scripts":{"tauri":"tauri"}}\n' > package.json
          npm install --no-save @tauri-apps/cli@$TAURI_CLI_VERSION

      - name: Build unsigned IPA
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION ios build --target aarch64 --ci --no-sign

      - name: Collect IPA
        run: |
          mkdir -p dist
          find src-tauri/gen/apple -type f -name "*.ipa" -exec cp {} dist/ \;
          test -n "$(find dist -name "*.ipa" -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: moyu-ios-unsigned
          path: dist/*.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
