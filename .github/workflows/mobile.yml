name: Build mobile

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Detect NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | tail -1)" >> "$GITHUB_ENV"

      - name: Generate icons
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION icon src-tauri/icons/app-icon.png -o src-tauri/icons

      - name: Init Android project
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION android init

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.MOYU_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MOYU_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/moyu.jks
          else
            # 无固定 keystore 时用临时签名（每次不同，覆盖安装需先卸载）
            keytool -genkeypair -v -keystore /tmp/moyu.jks -storepass moyu12345 -keypass moyu12345 \
              -alias moyu -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Moyu, O=aiastia, C=CN"
          fi
          echo "KS_PASS_FINAL=${KS_PASS:-moyu12345}" >> "$GITHUB_ENV"

      # v2 CLI 已无签名参数; android.injected.signing.* 写进 gradle.properties 与
      # Android Studio 的注入签名同机制
      - name: Inject signing config into gradle
        run: |
          cat >> src-tauri/gen/android/gradle.properties <<EOF
          android.injected.signing.store.file=/tmp/moyu.jks
          android.injected.signing.store.password=$KS_PASS_FINAL
          android.injected.signing.key.alias=moyu
          android.injected.signing.key.password=$KS_PASS_FINAL
          EOF

      # gradle 的 rustBuild 任务从 src-tauri 调 npm run 找 CLI, 同样需要根 package.json
      - name: Prepare root npm project for gradle
        run: |
          printf '{"name":"moyu-client","private":true,"version":"0.0.0","scripts":{"tauri":"tauri"}}\n' > package.json
          npm install --no-save @tauri-apps/cli@$TAURI_CLI_VERSION

      - name: Build APK (arm64)
        env:
          MOYU_URL: ${{ secrets.MOYU_URL }}
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION android build --target aarch64 --apk

      - uses: actions/upload-artifact@v4
        with:
          name: moyu-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk

  # 无 Apple 开发者账号也能出未签名 ipa: --ci 让 CLI 供给 xcode 脚本阶段的
  # options 服务, --no-sign 跳过签名。Xcode 26 会挂, 必须用 macos-15 (Xcode 16)
  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION icon src-tauri/icons/app-icon.png -o src-tauri/icons

      - name: Init iOS project
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION ios init

      # Xcode 的 Build Rust Code 阶段经 npm run 从 gen/apple 向上找 package.json
      - name: Prepare root npm project for xcode script phase
        run: |
          printf '{"name":"moyu-client","private":true,"version":"0.0.0","scripts":{"tauri":"tauri"}}\n' > package.json
          npm install --no-save @tauri-apps/cli@$TAURI_CLI_VERSION

      - name: Build unsigned IPA
        env:
          MOYU_URL: ${{ secrets.MOYU_URL }}
        run: npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION ios build --target aarch64 --ci --no-sign

      - name: Collect IPA
        run: |
          mkdir -p dist
          find src-tauri/gen/apple -type f -name "*.ipa" -exec cp {} dist/ \;
          test -n "$(find dist -name "*.ipa" -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: moyu-ios-unsigned
          path: dist/*.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
