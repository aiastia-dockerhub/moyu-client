name: Build mobile

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Detect NDK
        run: echo "ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | tail -1)" >> "$GITHUB_ENV"

      - name: Generate icons
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/app-icon.png -o src-tauri/icons

      - name: Init Android project
        run: npx --yes @tauri-apps/cli android init

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.MOYU_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MOYU_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/moyu.jks
          else
            # 无固定 keystore 时用临时签名（每次不同，覆盖安装需先卸载）
            keytool -genkeypair -v -keystore /tmp/moyu.jks -storepass moyu12345 -keypass moyu12345 \
              -alias moyu -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Moyu, O=aiastia, C=CN"
          fi
          echo "KS_PASS_FINAL=${KS_PASS:-moyu12345}" >> "$GITHUB_ENV"

      # gradle 的 rustBuild 任务从 src-tauri 调 npm run 找 CLI, 同样需要根 package.json
      - name: Prepare root npm project for gradle
        run: |
          printf '{"name":"moyu-client","private":true,"version":"0.0.0","scripts":{"tauri":"tauri"}}\n' > package.json
          npm install --no-save @tauri-apps/cli

      - name: Build APK (arm64)
        env:
          MOYU_URL: ${{ secrets.MOYU_URL }}
          TAURI_ANDROID_KEYSTORE_PATH: /tmp/moyu.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ env.KS_PASS_FINAL }}
          TAURI_ANDROID_KEY_ALIAS: moyu
          TAURI_ANDROID_KEY_PASSWORD: ${{ env.KS_PASS_FINAL }}
        run: npx --yes @tauri-apps/cli android build --target aarch64 --apk

      - uses: actions/upload-artifact@v4
        with:
          name: moyu-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/app-icon.png -o src-tauri/icons

      - name: Init iOS project
        run: npx --yes @tauri-apps/cli ios init

      # Xcode 的 Build Rust Code 阶段经 npm run 从 gen/apple 向上找 package.json,
      # CLI 以 package.json 所在目录为根找 src-tauri —— 所以 shim 必须放仓库根
      - name: Prepare root npm project for xcode script phase
        run: |
          printf '{"name":"moyu-client","private":true,"version":"0.0.0","scripts":{"tauri":"tauri"}}\n' > package.json
          npm install --no-save @tauri-apps/cli

      - name: Build unsigned IPA
        env:
          MOYU_URL: ${{ secrets.MOYU_URL }}
        run: |
          PROJ=$(find src-tauri/gen -maxdepth 2 -name "*.xcodeproj" | head -1)
          echo "project: $PROJ"
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "import json,sys;d=json.load(sys.stdin);p=d.get('project',d);print((p.get('schemes') or [''])[0])")
          echo "scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION=Release
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -qry moyu-ios-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/dist" && mv /tmp/moyu-ios-unsigned.ipa "$GITHUB_WORKSPACE/dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: moyu-ios-unsigned
          path: dist/*.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
