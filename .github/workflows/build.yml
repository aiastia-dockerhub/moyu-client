name: Build Moyu client

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 内嵌前端来源（App 跟随 dev 打包）
  BOOK_REF: dev

jobs:
  # 构建 Nuxt SPA 静态包（内嵌进客户端，页面本地秒开；API/WS 走 MOYU_URL）
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aiastia/book
          ref: ${{ env.BOOK_REF }}
          token: ${{ secrets.MOYU_SOURCE_TOKEN }}
          sparse-checkout: frontend
          path: book

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/frontend/package-lock.json

      - name: Build frontend
        working-directory: book/frontend
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.MOYU_URL }}
          NUXT_PUBLIC_APP_MODE: 'true'
        run: |
          npm ci
          npx nuxt generate

      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: book/frontend/.output/public/

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            name: macos-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            name: windows-x64
            args: --bundles nsis,msi
          - platform: ubuntu-latest
            name: linux-x64
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: src-tauri/app-dist

      # 更新进度小窗的页面（由 lib.rs 的 update-progress 窗口加载）
      - name: Add updater progress page
        shell: bash
        run: |
          cat > src-tauri/app-dist/progress.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>
          body{margin:0;font-family:-apple-system,'PingFang SC',sans-serif;background:#171A24;color:#F0EBD8;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
          .t{font-size:13px;opacity:.85}
          .bar{width:230px;height:8px;background:#2A2E3D;border-radius:4px;margin-top:14px;overflow:hidden}
          #p{width:0%;height:100%;background:#F0EBD8;transition:width .15s}
          #t{margin-top:10px;font-size:12px;opacity:.6}
          </style></head><body>
          <div class="t">正在下载更新…（关闭本窗口 = 取消本次更新）</div>
          <div class="bar"><div id="p"></div></div>
          <div id="t">0%</div>
          <script>window.up=function(p){document.getElementById('p').style.width=p+'%';document.getElementById('t').textContent=p+'%';};</script>
          </body></html>
          HTML

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 从 app-icon.png 重新生成全平台图标（含正确的 Windows .ico）
      - name: Generate icons
        run: npx --yes @tauri-apps/cli@2.11.4 icon src-tauri/icons/app-icon.png -o src-tauri/icons

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Moyu ${{ github.ref_name }}'
          releaseBody: '墨语桌面客户端（前端内嵌，秒开，支持应用内自动更新）。未签名：mac 首次打开右键→打开；Windows SmartScreen 点更多信息→仍要运行。'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moyu-${{ matrix.name }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
