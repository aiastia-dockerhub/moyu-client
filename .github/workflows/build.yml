name: Build Moyu client

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            name: macos-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            name: windows-x64
            args: --bundles nsis,msi
          - platform: ubuntu-latest
            name: linux-x64
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 从 app-icon.png 重新生成全平台图标（含正确的 Windows .ico）
      - name: Generate icons
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/app-icon.png -o src-tauri/icons

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOYU_URL: ${{ secrets.MOYU_URL }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Moyu ${{ github.ref_name }}'
          releaseBody: '墨语桌面客户端，全部未签名。mac 首次打开右键→打开；Windows SmartScreen 点更多信息→仍要运行。'
          releaseDraft: false
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moyu-${{ matrix.name }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
